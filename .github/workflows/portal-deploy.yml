name: portal-deploy

# main push 시 dev 자동 배포: 테스트 → terraform apply(Lambda 포함) → 프론트 빌드 → S3 업로드 → CloudFront 무효화
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "personal-portal/backend/**"
      - "personal-portal/frontend/**"
      - "personal-portal/infra/modules/**"
      - "personal-portal/infra/envs/dev/**"
      - ".github/workflows/portal-deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: portal-deploy-dev
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: personal-portal/backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: personal-portal/frontend/package-lock.json

      - name: Frontend typecheck
        working-directory: personal-portal/frontend
        run: |
          npm ci
          npx tsc

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform apply
        id: tf
        working-directory: personal-portal/infra/envs/dev
        env:
          TF_VAR_host_email: ${{ secrets.HOST_EMAIL }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
          {
            echo "api_endpoint=$(terraform output -raw api_endpoint)"
            echo "web_bucket=$(terraform output -raw web_bucket)"
            echo "distribution_id=$(terraform output -raw web_distribution_id)"
            echo "user_pool_id=$(terraform output -raw user_pool_id)"
            echo "user_pool_client_id=$(terraform output -raw user_pool_client_id)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: personal-portal/frontend/package-lock.json

      - name: Build frontend
        working-directory: personal-portal/frontend
        env:
          VITE_API_BASE_URL: ${{ steps.tf.outputs.api_endpoint }}
          VITE_USER_POOL_ID: ${{ steps.tf.outputs.user_pool_id }}
          VITE_USER_POOL_CLIENT_ID: ${{ steps.tf.outputs.user_pool_client_id }}
        run: |
          npm ci
          npm run build

      - name: Upload to S3
        working-directory: personal-portal/frontend
        run: |
          # 해시가 붙은 정적 파일은 오래 캐시, index.html은 매번 새로 받게 한다
          aws s3 sync dist "s3://${{ steps.tf.outputs.web_bucket }}" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ steps.tf.outputs.web_bucket }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution_id }}" --paths "/*" \
            --query Invalidation.Id --output text
