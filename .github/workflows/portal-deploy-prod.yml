name: portal-deploy-prod

# prod 배포는 버튼으로만 (DESIGN.md 9.5): Actions → portal-deploy-prod → Run workflow, 확인란에 prod 입력
# dev에서 확인한 main을 그대로 올린다
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "prod에 배포하려면 prod 를 입력"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm input
        if: ${{ inputs.confirm != 'prod' || github.ref != 'refs/heads/main' }}
        run: |
          echo "확인란에 prod를 입력하고 main 브랜치에서 실행해야 합니다." >&2
          exit 1

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: personal-portal/backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: personal-portal/frontend/package-lock.json

      - name: Frontend typecheck
        working-directory: personal-portal/frontend
        run: |
          npm ci
          npx tsc

  deploy:
    needs: test
    uses: ./.github/workflows/portal-deploy-env.yml
    with:
      environment: prod
    secrets: inherit
