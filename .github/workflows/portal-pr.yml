name: portal-pr

# PR 검증: 테스트 + dev terraform plan (apply 안 함)
on:
  pull_request:
    paths:
      - "personal-portal/**"
      - ".github/workflows/portal-*.yml"

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: personal-portal/backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: personal-portal/frontend/package-lock.json

      - name: Frontend typecheck
        working-directory: personal-portal/frontend
        run: |
          npm ci
          npx tsc

  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-portal/infra/envs/dev
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build ai Lambda layer
        working-directory: ${{ github.workspace }}
        run: python personal-portal/backend/build_ai_layer.py dev

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        working-directory: personal-portal/infra
        run: terraform fmt -check -recursive

      - name: Terraform plan
        env:
          TF_VAR_host_email: ${{ secrets.HOST_EMAIL }}
        run: |
          terraform init -input=false
          terraform plan -input=false -lock=false
